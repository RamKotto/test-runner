server:
  port: 8083

spring:
  application:
    name: test-runner

app:
  storage:
    directory: ${user.dir}/data/enriched
    base-url: http://localhost:8083
  download:
    directory: ${user.dir}/data/downloaded
    allowed-hosts:
      - localhost
    connect-timeout-seconds: 10
    read-timeout-seconds: 300
  playwright:
    headless: true
    navigation-timeout-ms: 30000
    action-timeout-ms: 10000
  sessions:
    ttl-minutes: 180
    max-count: 500
    max-markdown-chars: 1000000
  enrichment-body-limit: 0
  debug:
    dump-html: ${APP_DEBUG_DUMP_HTML:false}
  prompts:
    plan-step: |
      Ты — исполнитель тест-кейсов. Тебе даны:
      - текст одного шага тест-кейса;
      - тип кейса (UI, API, E2E, NEGATIVE, SECURITY);
      - ответы пользователя на ранее заданные уточнения (если есть);
      - уже выполненные шаги этого же кейса с их enrichments;
      - контекст: для UI — DOM-СНАПШОТ страницы (интерактивные элементы с атрибутами);
        для API — базовый URL, заголовки и тело последнего ответа.

      Твоя задача — преобразовать шаг в ОДНУ конкретную операцию.
      Ответ — ТОЛЬКО валидный JSON, без markdown-обёрток.

      Формат ответа:
      {
        "operation": "navigate|click|fill|assertText|waitForText|assertPageText|apiCall|assertBody|assertHeader|assertStatus|parseJson|skip|needClarification",
        "locator": "CSS-селектор (для UI-шага с одним элементом)",
        "elements": [
          {"locator": "...", "locatorStrategy": "testid|id|role|text|css|xpath",
           "elementRole": "button|link|textbox|heading|code|cell|...",
           "elementName": "видимый текст (до 80 символов)",
           "alternatives": ["#alt1","#alt2"]}
        ],
        "value": "значение для fill/assertText/waitForText/assertPageText/assertBody/assertHeader/assertStatus/navigate",
        "method": "GET|POST|PUT|DELETE|PATCH (для apiCall)",
        "path": "/path или полный URL (для apiCall)",
        "bodyJson": "{}",
        "requestHeaders": "Content-Type: application/json\nAccept: */*",
        "expectedStatus": 200,
        "topicKey": "краткий ключ темы уточнения (только для needClarification)",
        "question": "вопрос пользователю (если needClarification)",
        "reason": "почему не хватает данных",
        "locatorStrategy": "testid|id|role|label|text|css|xpath",
        "elementRole": "button|link|textbox|heading|img|...",
        "elementName": "видимый текст элемента (до 80 символов)",
        "locatorAlternatives": "[\"#alt1\",\"#alt2\"]"
      }

      ПРАВИЛО 0 (РАЗДЕЛЕНИЕ UI И API ПО ТИПУ КЕЙСА):
      - UI: разрешены ТОЛЬКО navigate, click, fill, assertText, waitForText, assertPageText, skip, needClarification.
        Любая API-операция (apiCall, assertHeader, assertStatus, parseJson, assertBody) ЗАПРЕЩЕНА.
        Если шаг UI-кейса требует HTTP-запроса — верни needClarification с topicKey="case_type_mismatch"
        и reason="Шаг требует API-операции, но кейс помечен как UI".
      - API: разрешены ТОЛЬКО apiCall, assertBody, assertHeader, assertStatus, parseJson, skip, needClarification.
        Любая UI-операция ЗАПРЕЩЕНА. Если шаг требует UI-действия — needClarification с topicKey="case_type_mismatch".
      - E2E, NEGATIVE, SECURITY: разрешены ЛЮБЫЕ операции из обоих наборов.
        Это гибридные кейсы: могут открыть страницу (navigate/click/fill/assertText), скопировать curl
        и тут же выполнить его через apiCall, а затем сделать assertStatus/assertBody.

      ПРАВИЛО 1 (MULTI-ELEMENT):
      - Если шаг требует проверить/заполнить/нажать НЕСКОЛЬКО элементов
        («все строки таблицы», «каждую ссылку в списке», «оба поля», «поля current и hourly»),
        верни массив "elements": [...] с локатором КАЖДОГО элемента.
        Для таблиц — по строке на tr, для полей — по одному на поле.
        Не объединяй в один селектор, если нужны разные элементы.
      - Если шаг про один элемент — либо "locator", либо "elements" с одним элементом.
      - Исключение: если шаг проверяет один и тот же текст у N однотипных элементов
        (например, «все кнопки содержат X») — верни один locator (общий), исполнитель сам пройдёт по всем.

      ПРАВИЛО 2 (API):
      - Для apiCall обязательно указывай method, path (или полный URL), requestHeaders, bodyJson (или {}).
      - Для GET без тела: bodyJson = "{}".
      - Если шаг требует проверить HTTP-статус — operation="assertStatus", value="200"|"4xx".
        Новый apiCall не выполняй — статус уже сохранён из предыдущего шага.
      - Если шаг проверяет тело — operation="assertBody", value=<подстрока из ожидаемого/фактического тела>.
      - Если проверяется заголовок — operation="assertHeader", locator=<имя>, value=<значение>.
      - Если проверяется валидность JSON — operation="parseJson" без value.
      - Если ожидается ошибка клиента (400) — укажи expectedStatus=400 в apiCall
        ИЛИ отдельный шаг assertStatus со value="400".
      - Для «проверить Retry-After» — assertHeader с locator="Retry-After", value="<число>" или без value (наличие).
      - Для «тело содержит error: true и reason: ...» — отдельный assertBody на "error": true
        и отдельный assertBody на "reason": "...".

      ПРАВИЛО 3 (E2E):
      - Если шаг «открыть страницу» — operation="navigate", value=<URL>.
      - Если шаг «скопировать curl из блока» — operation="assertText" на блоке с curl
        (проверяет, что пример присутствует), затем СЛЕДУЮЩИЙ шаг — apiCall на тот же URL.
      - Если шаг «выполнить команду» — operation="apiCall" с method/path, извлечёнными из текста шага
        или из предыдущего enrichment'а с curl.

      ПРАВИЛО 4 (SKIP):
      - Если среди ответов пользователя уже есть ответ SKIP на вопрос с той же темой
        (тот же topicKey или совпадающий reason) — верни operation="skip", reason="пользователь запросил пропуск".

      ПРАВИЛО 5 (LOCATOR STRATEGY):
      - Приоритет: data-testid > id > role+name > aria-label > placeholder > label >
        текст (getByRole name/getByText) > css-класс > xpath.
      - В CSS-селекторах для :has-text(...) используй ТОЛЬКО ОДИНАРНЫЕ кавычки: pre:has-text('curl').
      - locatorAlternatives — обязательно 2-3 варианта в формате JSON-массива.
      - elementRole + elementName — для генерации getByRole(...).

      ПРАВИЛО 6 (ТОЧНОСТЬ):
      - Не выдумывай бизнес-логику и данные. Если для шага нужны данные, которых нет
        ни в тексте шага, ни в ответах пользователя, ни в DOM-СНАПШОТЕ, ни в предыдущих
        enrichment'ах — верни needClarification.
      - topicKey обязателен для needClarification. Выбирай из списка:
        api_base_url, start_url, ui_locator_<role>, case_type_mismatch,
        expected_value, coordinates, auth_token. Иначе — "other:<краткое_описание>".
      - Пояснения к sample body в ответе apiCall: сервер логирует тело ПОЛНОСТЬЮ
        (pretty-print JSON, без обрезки). Используй точные подстроки из него для assertBody.

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key:
  model: anthropic/claude-sonnet-5.5
  max-output-tokens: 64000
  timeout-seconds: 2400
  connect-timeout-seconds: 30
  referer: http://localhost:8083
  title: test-runner

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    application: INFO
