server:
  port: 8083

spring:
  application:
    name: test-runner

app:
  storage:
    directory: ${user.dir}/data/enriched
    base-url: http://localhost:8083
  download:
    directory: ${user.dir}/data/downloaded
    allowed-hosts:
      - localhost
    connect-timeout-seconds: 10
    read-timeout-seconds: 120
  playwright:
    headless: true
    navigation-timeout-ms: 30000
    action-timeout-ms: 10000
  sessions:
    ttl-minutes: 180
    max-count: 500
    max-markdown-chars: 1000000
  prompts:
    plan-step: |
      Ты — исполнитель тест-кейсов. Тебе даны:
      - текст одного шага тест-кейса;
      - тип кейса (UI или API);
      - ответы пользователя на ранее заданные уточнения (если есть);
      - контекст: для UI — фрагмент HTML текущей страницы; для API — базовый URL (если известен).
      
      Твоя задача — преобразовать шаг в ОДНУ конкретную операцию.
      Ответ — ТОЛЬКО валидный JSON, без markdown-обёрток.
      
      Формат ответа:
      {"operation": "navigate|click|fill|assertText|apiCall|needClarification",
       "locator": "CSS-селектор (для UI)",
       "value": "значение для fill/assertText/navigate",
       "method": "GET|POST|PUT|DELETE|PATCH (для apiCall)",
       "path": "/path или полный URL (для apiCall)",
       "bodyJson": "{}",
       "expectedStatus": 200,
       "question": "вопрос пользователю (если needClarification)",
       "reason": "почему не хватает данных"}
      
      ЖЁСТКИЕ ПРАВИЛА:
      1. ОБЯЗАТЕЛЬНО используй ответы пользователя из блока «Ранее пользователь ответил». 
         Если пользователь дал URL — используй его для navigate (в поле value) 
         или для apiCall (в поле path, если URL полный). 
         Если ответ снимает неопределённость шага — НЕ ЗАПРАШИВАЙ уточнение повторно.
      2. Не выдумывай бизнес-логику и данные. Если шаг требует конкретное значение, 
         которого нет ни в тексте шага, ни в ответах пользователя — верни needClarification.
      3. UI: используй ТОЛЬКО элементы, реально присутствующие в HTML. 
         Если подходящего элемента нет — needClarification.
      4. API: если пользователь дал полный URL — верни его в поле path 
         (например, path="https://iss.moex.com/iss/..."). 
         Если дал базу — верни path="/..." .
      5. Для шага "открыть страницу" используй operation="navigate", 
         value=<URL из шага, или из ответа пользователя>.
      6. Никаких дополнительных полей.

openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key:
  model: openrouter/free
  max-output-tokens: 40000
  timeout-seconds: 2400
  connect-timeout-seconds: 30
  referer: http://localhost:8083
  title: test-runner

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    application: INFO
